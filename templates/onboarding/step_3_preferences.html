{% extends "org_base.html" %}

{% block content %}

<main class="flex-grow w-full max-w-5xl mx-auto p-6 md:p-12">

<!-- HEADER -->
<div class="mb-10">

    <div class="flex items-center gap-2 mb-3">
        <span class="px-2.5 py-0.5 bg-primary-container/20 text-on-primary-container text-xs font-bold uppercase tracking-widest rounded-full">
            Step 3 of 3
        </span>

        <div class="flex-grow h-1.5 bg-surface-container rounded-full overflow-hidden">
            <div class="w-full h-full bg-primary-container rounded-full"></div>
        </div>
    </div>

    <h1 class="font-display text-display text-on-surface mb-2">
        Set communication preferences
    </h1>

    <p class="text-body-md text-on-surface-variant">
        These settings help AlmaTouch adapt messaging to your community style.
    </p>
</div>


<!-- FORM -->
<form method="POST" class="space-y-8">

<!-- COMMUNICATION TONE -->
<div class="bg-surface-container-lowest p-8 rounded-2xl border border-outline-variant/30 shadow-sm">

    <label class="block font-label-md text-on-surface mb-2">
        Communication Tone
    </label>

    <select name="comm_type"
        class="w-full p-3 border border-outline rounded-lg focus:ring-2 focus:ring-primary text-body-md">

        <option value="friendly">Friendly</option>
        <option value="professional">Professional</option>
        <option value="inspirational">Inspirational</option>
        <option value="formal">Formal</option>

    </select>

    <p class="text-caption text-on-surface-variant mt-2">
        This affects default message templates and AI responses.
    </p>
</div>


<!-- TIMEZONE -->
<div class="bg-surface-container-lowest p-8 rounded-2xl border border-outline-variant/30 shadow-sm">

    <label class="block font-label-md text-on-surface mb-2">
        Timezone
    </label>

    <select name="timezone"
        class="w-full p-3 border border-outline rounded-lg focus:ring-2 focus:ring-primary text-body-md">

        <option value="Africa/Lagos">Africa/Lagos (WAT)</option>
        <option value="UTC">UTC</option>
        <option value="Europe/London">Europe/London</option>
        <option value="America/New_York">America/New_York</option>

    </select>

    <p class="text-caption text-on-surface-variant mt-2">
        Used for scheduling events and reminders.
    </p>
</div>


<!-- ACTION -->
<div class="pt-4 flex justify-between items-center">

    <a href="{{ url_for('org.org_onboarding_step_2') }}"
       class="text-caption text-on-surface-variant underline">
        Back
    </a>

    <button type="submit"
        class="px-10 py-4 bg-primary text-on-primary font-headline-md rounded-xl shadow-lg shadow-primary/20 hover:bg-primary/90 active:scale-95 transition-all">
        Finish Setup
    </button>

</div>

</form>

</main>

{% endblock %}
